<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helmet Corp — Store Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <header class="hero">
      <div class="brand">
        <span class="logo">🏪</span>
        <div>
          <p class="eyebrow">Helmet Corp Store</p>
          <h1>Fulfillment Portal</h1>
        </div>
      </div>
      <p class="subtitle">
        Pack and ship thank-you rewards to department heads. Mark each order shipped once
        the package leaves the corp store.
      </p>
    </header>

    <main class="layout">
      <section class="panel stats">
        <div>
          <p class="stat-label">Pending shipment</p>
          <p class="stat-value" id="pending-count">0</p>
        </div>
        <div>
          <p class="stat-label">Shipped today</p>
          <p class="stat-value" id="shipped-count">0</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Open orders</h2>
          <p>Ship the package to the department head listed on each order.</p>
        </div>
        <div id="orders" class="orders"></div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
