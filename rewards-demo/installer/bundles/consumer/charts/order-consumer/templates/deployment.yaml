{{- if .Values.orderConsumer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: order-consumer
  namespace: {{ .Values.orderConsumer.namespace }}
  labels:
    app: order-consumer
    app.kubernetes.io/part-of: rewards-demo
spec:
  selector:
    app: order-consumer
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-consumer
  namespace: {{ .Values.orderConsumer.namespace }}
  labels:
    app: order-consumer
    app.kubernetes.io/part-of: rewards-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-consumer
  template:
    metadata:
      labels:
        app: order-consumer
        app.kubernetes.io/part-of: rewards-demo
    spec:
      containers:
        - name: order-consumer
          image: {{ .Values.orderConsumer.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /tmp/app/public /tmp/.npm
              cp /opt/app-src/server.js /opt/app-src/data.js /opt/app-src/package.json /tmp/app/
              cp /opt/app-src/index.html /opt/app-src/app.js /opt/app-src/styles.css /tmp/app/public/
              cd /tmp/app
              npm install --omit=dev --cache /tmp/.npm
              exec node server.js
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_CACHE
              value: /tmp/.npm
            - name: PORT
              value: "8080"
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orderConsumer.database.secretName }}
                  key: host
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orderConsumer.database.secretName }}
                  key: port
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orderConsumer.database.secretName }}
                  key: user
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orderConsumer.database.secretName }}
                  key: password
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orderConsumer.database.secretName }}
                  key: dbname
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orderConsumer.rabbitmq.secretName }}
                  key: amqp_url
            - name: QUEUE_NAME
              value: {{ .Values.orderConsumer.queueName | quote }}
          volumeMounts:
            - name: app
              mountPath: /opt/app-src
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: app
          configMap:
            name: order-consumer-app
{{- end }}
