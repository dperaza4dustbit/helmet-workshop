---
rabbitmq:
  enabled: false
  namespace: default
  queueName: orders
  username: orders
  secretName: rabbitmq-user
  image:
    repository: docker.io/library/rabbitmq
    tag: 3.13-management-alpine
    pullPolicy: IfNotPresent
  service:
    name: rabbitmq
    port: 5672
    managementPort: 15672
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
